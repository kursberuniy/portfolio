<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro DevPortfolio Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- CHAP PANEL: BOSHQRUV VA INPUTLAR -->
    <div class="sidebar">
      <h2>🛠 Portfolio Builder</h2>
      <p class="subtitle">Ma'lumotlarni kiriting va jonli natijani ko'ring!</p>

      <!-- HERO SECTION -->
      <div class="control-card">
        <h3>1. Bosh sahifa (Hero)</h3>
        <label>Ism-sharifingiz:</label>
        <input type="text" id="input-name" value="Ali Valiyev">
        
        <label>Kasbingiz / Yo'nalishingiz:</label>
        <input type="text" id="input-role" value="Full-Stack Developer">
        
        <label>Qisqa shior (Bio):</label>
        <textarea id="input-bio" rows="2">Zamonaviy, tez va xavfsiz veb-saytlar hamda ilovalar yarataman.</textarea>
      </div>

      <!-- SKILLS SECTION -->
      <div class="control-card">
        <h3>2. Ko'nikmalar (Skills)</h3>
        <label>Texnologiyalar (vergul bilan):</label>
        <input type="text" id="input-skills" value="HTML5, CSS3, JavaScript, React, Node.js, Git, Figma">
      </div>

      <!-- DYNAMIC PROJECTS SECTION -->
      <div class="control-card">
        <h3>3. Loyihalar (Projects)</h3>
        <div id="projects-inputs-container">
          <!-- JS orqali dinamik loyiha inputlari tushadi -->
        </div>
        <button type="button" id="btn-add-project" class="btn-secondary">➕ Yangi loyiha qo'shish</button>
      </div>

      <!-- DYNAMIC EXPERIENCE SECTION -->
      <div class="control-card">
        <h3>4. Ish Tajribasi (Experience)</h3>
        <div id="exp-inputs-container">
          <!-- JS orqali dinamik tajriba inputlari tushadi -->
        </div>
        <button type="button" id="btn-add-exp" class="btn-secondary">➕ Yangi tajriba qo'shish</button>
      </div>

      <!-- CONTACT SECTION -->
      <div class="control-card">
        <h3>5. Aloqa (Contact)</h3>
        <label>Email:</label>
        <input type="text" id="input-email" value="ali.dev@example.com">
        <label>Telegram / LinkedIn / GitHub:</label>
        <input type="text" id="input-social" value="Telegram: @ali_dev | GitHub: github.com/alidev">
      </div>

      <button id="btn-generate-code" class="btn-primary">📋 HTML & CSS Kodni Olish</button>
    </div>

    <!-- O'NG PANEL: LIVE PREVIEW -->
    <div class="preview-container">
      <div class="preview-header">
        <span>🔴 🟡 🟢 Live Preview</span>
      </div>
      <div id="preview-area" class="preview-body">
        <!-- JS orqali dinamik kontent yuklanadi -->
      </div>
    </div>
  </div>

  <!-- KODNI KO'RSATISH MODAL OYNASI -->
  <div id="code-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Tayyor HTML & CSS Kodingiz</h3>
        <button id="btn-close-modal">✖</button>
      </div>
      <div class="modal-body">
        <h4>HTML Kod:</h4>
        <textarea id="output-html" readonly></textarea>
        <h4>CSS Kod:</h4>
        <textarea id="output-css" readonly></textarea>
      </div>
      <button id="btn-copy-code" class="btn-primary">📋 Kodlarni Nusxalash</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
